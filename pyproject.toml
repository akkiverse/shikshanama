[project]
name = "shikshanama"
version = "0.1.0"
description = "Shikshanama (शिक्षाNama) Official Website & Admin CMS by AkkiVerse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "pydantic==2.10.4",
    "pillow==11.1.0",
    "python-multipart==0.0.20",
    "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
