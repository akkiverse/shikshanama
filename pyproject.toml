[project]
name = "shikshanama"
version = "0.1.0"
description = "Shikshanama (शिक्षाNama) Official Website & Admin CMS by AkkiVerse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pillow>=11.0.0",
    "python-multipart>=0.0.18",
    "psycopg[binary]>=3.1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
